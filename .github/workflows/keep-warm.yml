name: Keep production warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping frontend (UA)
        continue-on-error: true
        run: curl -sS -o /dev/null -w 'frontend /uk -> %{http_code} in %{time_total}s\n' https://razom.ch/uk

      - name: Ping frontend (DE)
        continue-on-error: true
        run: curl -sS -o /dev/null -w 'frontend /de -> %{http_code} in %{time_total}s\n' https://razom.ch/de
